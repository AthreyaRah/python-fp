      - foundations/07-builtin-containers-and-complexity.md
      - foundations/08-the-collections-module.md
      - foundations/09-comprehensions.md
      - foundations/10-iterators-and-the-iterator-protocol.md
      - foundations/11-generators-and-yield-from.md
      - foundations/12-functions-args-closures.md
      - foundations/13-decorators.md
      - foundations/14-functools.md
      - foundations/15-itertools.md
      - foundations/16-scope-legb.md
      - foundations/17-exceptions.md
      - foundations/18-context-managers.md
